apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest

  role: "${NODE_ROLE_NAME}"    # envsubst fills this from install.sh

  # ── Discovers your private subnets via the tag already in your vpc module ──
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
        Type: "private"           # ensures only private subnets, not pod subnets

  # ── Discovers the default cluster SG tagged in Step 1 of install.sh ──
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true