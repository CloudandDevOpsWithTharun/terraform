# efs-storageclass.yaml

apiVersion: storage.k8s.io/v1
kind: StorageClass

metadata:
  name: efs-sc

provisioner: efs.csi.aws.com

parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0b076964554da1156
  directoryPerms: "777"

mountOptions:
  - tls

reclaimPolicy: Retain

volumeBindingMode: Immediate
