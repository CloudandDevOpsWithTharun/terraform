apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-secrets

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: nginx-secrets

  template:

    metadata:
      labels:
        app: nginx-secrets

    spec:

      serviceAccountName: app-sa

      containers:

      - name: nginx

        image: nginx:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 80

        volumeMounts:
        - name: app-secrets
          mountPath: /etc/secrets
          readOnly: true

        resources:

          requests:
            cpu: "4000m"
            memory: "256Mi"

          limits:
            cpu: "5000m"
            memory: "512Mi"

        readinessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 15
          periodSeconds: 20

      volumes:
      - name: app-secrets
        secret:
          secretName: app-secrets