
apiVersion: apps/v1
kind: Deployment

metadata:
  name: adminer

spec:
  replicas: 1

  selector:
    matchLabels:
      app: adminer

  template:

    metadata:
      labels:
        app: adminer

    spec:

      serviceAccountName: app-sa

      containers:

      - name: adminer

        image: adminer:latest

        ports:
        - containerPort: 8080

        resources:

          requests:
            cpu: "200m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:

          httpGet:
            path: /
            port: 8080

          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:

          httpGet:
            path: /
            port: 8080

          initialDelaySeconds: 20
          periodSeconds: 20

        volumeMounts:

        - name: secrets-store-inline

          mountPath: "/etc/secrets"

          readOnly: true

      volumes:

      - name: secrets-store-inline

        csi:

          driver: secrets-store.csi.k8s.io

          readOnly: true

          volumeAttributes:
            secretProviderClass: "aws-test-secret"

---
apiVersion: v1
kind: Service

metadata:
  name: adminer-service

spec:
  type: ClusterIP

  selector:
    app: adminer

  ports:
  - port: 80
    targetPort: 8080


