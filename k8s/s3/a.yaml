apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-s3

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-s3

  template:
    metadata:
      labels:
        app: nginx-s3

    spec:
      serviceAccountName: s3-csi-driver-sa
      containers:
      - name: nginx

        image: nginx

        volumeMounts:
        - name: s3-storage
          mountPath: /usr/share/nginx/html

      volumes:
      - name: s3-storage

        persistentVolumeClaim:
          claimName: s3-pvc
